<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | POST-LARVAI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* Background image na may light white overlay para lumitaw ang background at maging clear ang card */
            background: linear-gradient(rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.55)), 
                        url("{{ url_for('static', filename='images/background.jpeg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); 
            width: 100%;
            max-width: 380px; 
            text-align: center; 
        }
        .logo-section {
            margin-bottom: 20px;
        }
        .app-logo {
            width: 150px;
            height: 150px;
            margin-bottom: 0px;
            object-fit: contain;
        }
        .login-card h2 { 
            color: #00a8cc; 
            margin: 5px 0; 
            font-size: 24px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .encrypted-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e7f1ff; 
            color: #00a8cc;      
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .sign-in-text {
            color: #475569;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .input-group { 
            position: relative;
            margin-bottom: 15px; 
            text-align: left; 
        }
        .input-group input { 
            width: 100%; 
            padding: 12px 40px 12px 15px; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #00a8cc; 
            box-shadow: 0 0 0 3px rgba(0, 168, 204, 0.15);
        }
        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
        }
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin: 15px 0 20px 0;
            color: #64748b;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .forgot-password {
            color: #00a8cc; 
            text-decoration: none;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .btn { 
            width: 100%; 
            padding: 12px; 
            background: #00a8cc; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px;
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s ease;
        }
        .btn:hover { 
            background: #008ba8; 
        }
        .error { 
            color: #ef4444; 
            background: #fee2e2;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px; 
            margin-bottom: 15px; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-section">
            <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="POST-LARVAI Logo" class="app-logo">
            <h2>POST-LARVAI</h2>
            <p class="subtitle">Secure hatchery monitoring dashboard</p>
            
            <div class="encrypted-badge">
                <i class="fa-solid fa-shield-halved"></i> Encrypted Session
            </div>
        </div>

        <p class="sign-in-text">Sign in to continue</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username or Email" required>
                <i class="fa-regular fa-envelope input-icon"></i>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
                <i class="fa-regular fa-lock input-icon"></i>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Remember Me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn">Sign In</button>
        </form>
    </div>

</body>
</html>
